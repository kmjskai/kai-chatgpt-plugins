name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Validate included payload
        run: python3 scripts/validate_plugin.py
      - name: Test package rejection paths
        run: python3 -m unittest discover -s tests -v
      - name: Build and test the included source
        working-directory: plugins/kai-icloud-calendar/server
        run: |
          npm run build
          npm test
      - name: Validate rebuilt payload and archive round trip
        run: |
          python3 scripts/refresh_provenance.py
          python3 scripts/validate_plugin.py
          python3 scripts/package_plugin.py
